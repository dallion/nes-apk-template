name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      MAKEFLAGS: -j4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/toolchain.lock.json', 'gradle.properties') }}
      - name: Prepare project tools
        shell: powershell
        run: |
          $sdkSource = $env:ANDROID_HOME
          1..100 | ForEach-Object { 'y' } | & powershell -NoProfile -ExecutionPolicy Bypass -File tools/setup-toolchain.ps1 -SdkSource $sdkSource
          if ($LASTEXITCODE -ne 0) { throw 'Tool preparation failed.' }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test, package and lint
        shell: pwsh
        run: |
          & ./.toolchains/pwsh/pwsh.exe -NoProfile -File tests/build-checks.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build checks failed.' }
      - name: Upload reports and test APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/intermediates/cxx/**/logs/
            tmp/**/*pack-checks*/
            outputs/ci_probe/
          retention-days: 7
