name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2025
          - name: linux
            os: ubuntu-24.04
          - name: macos-intel
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MAKEFLAGS: -j4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchains
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/toolchain.lock.json', 'gradle.properties') }}
      - name: Prepare project tools
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $sdkSource = $env:ANDROID_HOME
          & powershell -NoProfile -ExecutionPolicy Bypass -File tools/setup-toolchain.ps1 -SdkSource $sdkSource -AcceptAndroidLicenses
          if ($LASTEXITCODE -ne 0) { throw 'Tool preparation failed.' }
      - name: Prepare project tools (Unix)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          guard="$RUNNER_TEMP/no-powershell"
          mkdir -p "$guard"
          printf '%s\n' '#!/bin/sh' 'echo "PowerShell is unavailable to the Unix build" >&2' 'exit 127' > "$guard/pwsh"
          chmod +x "$guard/pwsh"
          ln -s pwsh "$guard/powershell"
          export PATH="$guard:$PATH"
          printf '%s\n' "$guard" >> "$GITHUB_PATH"
          ./tools/setup-toolchain.sh -SdkSource "${ANDROID_HOME:-}" -AcceptAndroidLicenses
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Matches the fixed LibretroDroid and Oboe upstream commits in DEPENDENCIES.md.
          allow-checksums: e2b82129ab64751fd40437007bd2f7f2afb3c6e41a9198e628650b22d5824a14
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: false # Validated above, including the pinned upstream wrappers.
      - name: Test, package and lint (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $pwsh = './.toolchains/pwsh/pwsh.exe'
          $logs = 'tmp/' + (Get-Date -Format 'yyyy-MM-dd') + '-ci-checks'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $log = Join-Path $logs "attempt-$attempt.log"
            & $pwsh -NoProfile -File tests/build-checks.ps1 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -eq 0) { break }
            $output = Get-Content -LiteralPath $log -Raw
            $failures = [regex]::Matches($output, '(?s)\* What went wrong:(.*?)(?=\* Try:|\z)')
            $reason = if ($failures.Count) { $failures[$failures.Count - 1].Groups[1].Value } else { '' }
            if ($attempt -eq 3 -or $reason -notmatch '(?i)(HTTP (response code: |error )?(429|500|502|503|504)|status code:? (429|500|502|503|504)|Connection (timed out|reset)|Read timed out)') {
              throw 'Build checks failed.'
            }
            Start-Sleep -Seconds 5
          }
      - name: Test, package and lint (Unix)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test ! -e .toolchains/pwsh
          logs="tmp/$(date +%F)-ci-checks"
          mkdir -p "$logs"
          for attempt in 1 2 3; do
            log="$logs/attempt-$attempt.log"
            if bash tests/build-checks.sh 2>&1 | tee "$log"; then
              test ! -e .toolchains/pwsh
              break
            fi
            if [[ "$attempt" == 3 ]] || ! awk '
              /\* What went wrong:/ { reason = ""; active = 1; next }
              /\* Try:/ { active = 0 }
              active { reason = reason " " tolower($0) }
              END {
                exit !(reason ~ /(http (response code: |error )?(429|500|502|503|504)|status code:? (429|500|502|503|504)|connection (timed out|reset)|read timed out)/)
              }
            ' "$log"; then
              echo 'Build checks failed.' >&2
              exit 1
            fi
            sleep 5
          done
      - name: Upload reports and test APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/intermediates/cxx/**/logs/
            tmp/**/*pack-checks*/
            tmp/**/*ci-checks*/
            outputs/ci_probe/
          retention-days: 7
